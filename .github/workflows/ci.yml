name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit -p .

      - name: UI tests
        run: npx vitest run

      - name: Core tests
        run: npm run test:core

      - name: Build
        run: npm run build
